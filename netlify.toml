[build]
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."aviso-checkin"]
  schedule = "0 8 * * *"

[functions."backup-calendario"]
  schedule = "0 7 * * *"

[[redirects]]
  from = "/video/llave.mp4"
  to = "/.netlify/functions/media?name=llave"
  status = 200

[[redirects]]
  from = "/booking.ics"
  to = "/.netlify/functions/export-ical?src=booking"
  status = 200

[[redirects]]
  from = "/airbnb.ics"
  to = "/.netlify/functions/export-ical?src=airbnb"
  status = 200

[[redirects]]
  from = "/calendario.ics"
  to = "/.netlify/functions/export-ical"
  status = 200
